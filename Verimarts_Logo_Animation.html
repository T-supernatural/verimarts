<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verimarts — Logo Reveal</title>
<style>
:root{--red:#ff0000;--silver:#c0c0c0;--black:#050505}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#050505;color:#fff;font-family:Arial,Helvetica,sans-serif;overflow:hidden}
body{display:grid;place-items:center;background:radial-gradient(ellipse at 50% 52%,#17191d 0%,#090a0c 48%,#030303 100%)}
.stage{position:relative;width:min(100vw,177.78vh);height:min(100vh,56.25vw);aspect-ratio:16/9;overflow:hidden;background:radial-gradient(ellipse at center,#17191c 0%,#0b0c0e 50%,#050505 100%)}
.grain{position:absolute;inset:0;opacity:.07;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.32'/%3E%3C/svg%3E")}
.horizon{position:absolute;left:50%;top:52%;width:110%;height:1px;transform:translate(-50%,-50%);background:linear-gradient(90deg,transparent,#ffffff18 35%,#ff000052 50%,#ffffff18 65%,transparent);opacity:0;animation:horizon 5s ease both}
.road{position:absolute;left:50%;top:50%;width:88%;height:130%;transform:translate(-50%,-48%) perspective(500px) rotateX(67deg);opacity:.14;mask-image:linear-gradient(transparent 0%,#000 40%,transparent 90%)}
.road:before,.road:after{content:"";position:absolute;top:0;bottom:0;width:2px;background:linear-gradient(transparent,#c0c0c0aa,transparent);left:42%}.road:after{left:58%}
.lane{position:absolute;left:50%;top:5%;height:90%;width:3px;transform:translateX(-50%);background:repeating-linear-gradient(to bottom,#ff0000 0 16px,transparent 16px 35px);opacity:.6;animation:lanes 1.2s linear infinite}
.streak{position:absolute;left:-25%;top:48%;width:40%;height:2px;background:linear-gradient(90deg,transparent,#ff0000,white,transparent);box-shadow:0 0 20px #ff0000aa;transform:rotate(-8deg);animation:streak 1s .12s cubic-bezier(.2,.7,.1,1) both}
.logo{position:absolute;left:50%;top:49%;width:min(52%,720px);transform:translate(-50%,-50%);filter:drop-shadow(0 0 0 transparent);animation:logoGlow 5s ease both;}
.mark{display:block;width:clamp(95px,14vw,220px);height:auto;margin:0 auto 1.7%;overflow:visible}
.mark path{stroke-dasharray:400;stroke-dashoffset:400;animation:draw 1.12s .52s cubic-bezier(.65,0,.25,1) forwards}
.mark .outer{fill:none;stroke:#ff0000;stroke-width:12;stroke-linecap:square;stroke-linejoin:bevel}
.mark .lane{fill:none;stroke:#c0c0c0;stroke-width:5;stroke-linecap:square;stroke-linejoin:bevel;animation:draw .82s .82s cubic-bezier(.65,0,.25,1) forwards}
.word{display:flex;justify-content:center;align-items:baseline;gap:.012em;color:#f7f7f7;font-size:clamp(30px,6.2vw,92px);font-weight:900;letter-spacing:.07em;line-height:1;text-shadow:0 2px 18px #000;white-space:nowrap}
.word span{display:inline-block;opacity:0;transform:translateY(22px) scale(.8);animation:letter .42s cubic-bezier(.18,.9,.3,1.28) forwards;animation-delay:calc(1.44s + var(--i)*.105s)}
.word span:nth-child(3){color:#ff0000}.word span:nth-child(8){color:#c0c0c0}
.underline{height:2px;width:0;margin:3.2% auto 0;background:linear-gradient(90deg,transparent,#ff0000 18%,#c0c0c0 82%,transparent);animation:underline .65s 2.45s ease forwards}
.halo{position:absolute;left:50%;top:49%;width:35%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle,#ff00001c 0%,#c0c0c00a 36%,transparent 69%);opacity:0;animation:halo 5s ease both;pointer-events:none}
.controls{position:absolute;right:3%;bottom:4%;display:flex;gap:10px;opacity:.68}.controls button{color:#ddd;background:#111a;border:1px solid #ffffff30;border-radius:999px;padding:9px 14px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}.controls button:hover{border-color:#ff0000;color:#fff}
.caption{position:absolute;bottom:5%;left:4%;font-size:10px;letter-spacing:.3em;color:#c0c0c077;text-transform:uppercase;opacity:0;animation:caption 1s 3.2s ease forwards}
@keyframes streak{0%{left:-30%;opacity:0}15%{opacity:1}100%{left:120%;opacity:0}}
@keyframes horizon{0%,18%{opacity:0}40%{opacity:.8}100%{opacity:.34}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes letter{0%{opacity:0;transform:translateY(24px) scale(.78)}75%{opacity:1;transform:translateY(-3px) scale(1.04)}100%{opacity:1;transform:translateY(0) scale(1)}}
@keyframes underline{to{width:84%}}
@keyframes halo{0%,45%{opacity:0;transform:translate(-50%,-50%) scale(.7)}68%{opacity:.95;transform:translate(-50%,-50%) scale(1.15)}100%{opacity:.45;transform:translate(-50%,-50%) scale(1)}}
@keyframes logoGlow{0%,46%{filter:drop-shadow(0 0 0 transparent);transform:translate(-50%,-50%) scale(.96)}67%{filter:drop-shadow(0 0 28px #ff000055);transform:translate(-50%,-50%) scale(1.025)}80%,100%{filter:drop-shadow(0 0 16px #ff000026);transform:translate(-50%,-50%) scale(1)}}
@keyframes lanes{to{background-position:0 35px}}
@keyframes caption{to{opacity:1}}
.stage.replay .streak{animation:none}.stage.replay .logo,.stage.replay .halo,.stage.replay .horizon,.stage.replay .caption,.stage.replay .underline{animation:none}.stage.replay .mark path,.stage.replay .word span{animation:none}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-delay:0ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<main class="stage" id="stage" aria-label="Verimarts five-second animated logo reveal">
 <div class="road"><div class="lane"></div></div><div class="horizon"></div><div class="streak"></div><div class="halo"></div>
 <section class="logo" aria-label="Verimarts logo">
  <svg class="mark" viewBox="0 0 180 150" role="img" aria-label="Road-inspired V emblem">
   <path class="outer" d="M26 24 L78 126 Q90 145 102 126 L154 24"/>
   <path class="lane" d="M61 24 L90 81 L119 24"/>
  </svg>
  <div class="word" aria-label="VERIMARTS"><span style="--i:0">V</span><span style="--i:1">E</span><span style="--i:2">R</span><span style="--i:3">I</span><span style="--i:4">M</span><span style="--i:5">A</span><span style="--i:6">R</span><span style="--i:7">T</span><span style="--i:8">S</span></div>
  <div class="underline"></div>
 </section>
 <div class="caption">Driven by choice</div><div class="grain"></div>
 <div class="controls"><button id="replay">Replay reveal</button><button id="sound" aria-pressed="false">Sound: off</button></div>
</main>
<script>
const stage=document.querySelector('#stage');
function replay(){stage.classList.add('replay');void stage.offsetWidth;stage.classList.remove('replay');}
document.querySelector('#replay').addEventListener('click',replay);
let audioCtx;document.querySelector('#sound').addEventListener('click',async e=>{const b=e.currentTarget,on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',on);b.textContent='Sound: '+(on?'on':'off');if(!on)return;audioCtx??=new(window.AudioContext||window.webkitAudioContext)();await audioCtx.resume();const now=audioCtx.currentTime;[.78,1.5,1.61,1.72,1.83,1.94,2.05,2.16,2.27,2.38].forEach((t,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.setValueAtTime(i===0?420:520,now+t);o.frequency.exponentialRampToValueAtTime(i===0?180:260,now+t+.08);g.gain.setValueAtTime(.0001,now+t);g.gain.exponentialRampToValueAtTime(.07,now+t+.012);g.gain.exponentialRampToValueAtTime(.0001,now+t+.11);o.connect(g);g.connect(audioCtx.destination);o.start(now+t);o.stop(now+t+.12)});});
</script>
</body></html>
